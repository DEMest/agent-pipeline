# Копируется на сервер при каждой выкатке, лежит там в ~/.pipeline/<проект>/.
# Тег образа приходит переменной IMAGE от workflow — один и тот же файл
# обслуживает и выкатку, и откат на предыдущий образ.
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
# Healthcheck здесь намеренно не задан: живость сервиса проверяет workflow
# выкатки снаружи, по адресу из .pipeline/config.yml, и он же откатывает при провале.
