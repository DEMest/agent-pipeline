# Этот файл копируется на сервер при каждой выкатке и лежит там в ~/.pipeline/<проект>/.
# Тег образа приходит переменной IMAGE, которую подставляет workflow выкатки, —
# так один и тот же compose обслуживает и выкатку, и откат на предыдущий образ.
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
